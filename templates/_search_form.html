<form class="search-card" action="{{ url_for('search_view') }}" method="get">
  {# 현재 위치: 브라우저 위치를 숨은 칸 lat, lng에 넣어 보낸다. 대전 중구 밖이거나 못 받으면 서버가 기본 위치를 쓴다 #}
  {% set origin_keys = {'current': 'origin_current', 'outside': 'origin_outside'} %}
  <p class="muted small" id="origin-note" data-state="{{ origin_state }}" data-located="{{ t('origin_located') }}">{{ t(origin_keys.get(origin_state, 'origin_note')) }}</p>
  <input type="hidden" name="lat" id="origin-lat" value="{{ request.args.get('lat', '') if origin_state != 'default' }}">
  <input type="hidden" name="lng" id="origin-lng" value="{{ request.args.get('lng', '') if origin_state != 'default' }}">
  <label>{{ t('f_query') }}
    <input type="text" name="q" value="{{ cond.query }}" placeholder="{{ t('f_query_ph') }}">
  </label>
  <div class="row">
    <label>{{ t('f_distance') }}
      <select name="dist">
        {% for d in distance_options %}<option value="{{ d }}" {{ 'selected' if cond.max_km == d }}>{{ d }} km</option>{% endfor %}
      </select>
    </label>
    <label>{{ t('f_budget') }}
      <select name="budget">
        <option value="">{{ t('f_budget_none') }}</option>
        {% for b in budget_options %}<option value="{{ b }}" {{ 'selected' if cond.budget == b }}>{{ t('free') if b == 0 else '{:,}'.format(b) ~ ' ' ~ t('won') }}</option>{% endfor %}
      </select>
    </label>
  </div>
  <div class="row">
    <label>{{ t('f_day') }}
      <select name="day">
        <option value="">{{ t('f_any') }}</option>
        {% for i in range(7) %}<option value="{{ i }}" {{ 'selected' if cond.day == i }}>{{ t('day_' ~ i) }}</option>{% endfor %}
      </select>
    </label>
    <label>{{ t('f_time') }}
      <input type="time" name="time" value="{{ cond.time or '' }}">
    </label>
  </div>
  <fieldset>
    <legend>{{ t('f_categories') }}</legend>
    <div class="chips">
      {% for c in CATEGORIES %}
        <label class="chip"><input type="checkbox" name="cat" value="{{ c }}" {{ 'checked' if c in cond.categories }}><span>{{ t('cat_' ~ c) }}</span></label>
      {% endfor %}
    </div>
  </fieldset>
  <button type="submit" class="btn">{{ t('f_submit') }}</button>
</form>
<script>
  // 브라우저 위치 받기 (localhost·HTTPS에서만 동작). 거부·실패하면 숨은 칸을 비워 두어 기본 위치로 계산된다
  (function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      document.getElementById("origin-lat").value = pos.coords.latitude.toFixed(6);
      document.getElementById("origin-lng").value = pos.coords.longitude.toFixed(6);
      var note = document.getElementById("origin-note");
      if (note && note.dataset.state === "default") note.textContent = note.dataset.located;
    }, function () { /* 거부·시간 초과: 기본 위치 유지 */ },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
  })();
</script>
